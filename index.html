    <script>
      // Prevent benign development WebSocket / HMR reconnection notices from triggering error overlays
      window.addEventListener('unhandledrejection', function(event) {
        var str = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        if (
          str.indexOf('WebSocket closed without opened') !== -1 ||
          str.indexOf('failed to connect to websocket') !== -1 ||
          str.indexOf('[vite]') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
